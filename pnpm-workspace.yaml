packages:
  - backend
  - frontend

allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true

# Prisma Client generation intentionally writes generated artifacts under
# node_modules. Warn on dependency drift instead of reinstalling before every
# pnpm script and deleting those generated artifacts.
verifyDepsBeforeRun: warn
